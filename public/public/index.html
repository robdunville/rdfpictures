<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDF Pictures — Coming Soon</title>
<meta name="description" content="RDF Pictures. A new site is on the way.">
<meta name="theme-color" content="#0d0d0f">
<meta property="og:title" content="RDF Pictures">
<meta property="og:description" content="A new site is on the way.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rdfpictures.com/">
<link rel="canonical" href="https://rdfpictures.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d0d0f'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23e8c57a' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23e8c57a'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0d0f;
    --ink: #f3efe6;
    --muted: #8d8a83;
    --accent: #e8c57a;
    --line: rgba(243, 239, 230, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    position: relative;
  }
  /* soft projector glow */
  body::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(ellipse 50% 40% at 50% 42%, rgba(232, 197, 122, 0.13), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 110%, rgba(232, 197, 122, 0.05), transparent 70%);
    animation: breathe 9s ease-in-out infinite alternate;
    pointer-events: none;
  }
  /* widescreen frame lines */
  .frame {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: var(--line);
  }
  .frame.top { top: 12vh; }
  .frame.bottom { bottom: 12vh; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 14vh 1.5rem;
    position: relative;
    animation: rise 1.4s cubic-bezier(.2, .7, .2, 1) both;
  }
  .mark {
    width: 54px;
    height: 54px;
    margin-bottom: 2.25rem;
  }
  .mark .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .mark .dot { fill: var(--accent); }
  h1 {
    font-family: "Didot", "Bodoni 72", "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 6rem);
    letter-spacing: 0.04em;
    line-height: 1.02;
  }
  h1 span {
    display: block;
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: clamp(0.8rem, 2.2vw, 1.15rem);
    font-weight: 500;
    letter-spacing: 0.62em;
    text-indent: 0.62em; /* balances trailing letter-spacing */
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1.1rem;
  }
  .rule {
    width: 44px;
    height: 1px;
    background: var(--accent);
    margin: 2.5rem auto;
    opacity: 0.8;
  }
  .soon {
    font-size: 0.82rem;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--accent);
  }
  footer {
    position: relative;
    text-align: center;
    padding: 0 1rem 4.5vh;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes breathe {
    from { opacity: 0.75; transform: scale(1); }
    to   { opacity: 1;    transform: scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    main, body::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="frame top" aria-hidden="true"></div>
  <div class="frame bottom" aria-hidden="true"></div>

  <main>
    <svg class="mark" viewBox="0 0 54 54" aria-hidden="true">
      <circle class="ring" cx="27" cy="27" r="25"/>
      <circle class="ring" cx="27" cy="27" r="15" opacity=".45"/>
      <circle class="dot" cx="27" cy="27" r="4.5"/>
    </svg>
    <h1>RDF<span>Pictures</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="soon">Coming soon</p>
  </main>

  <footer>&copy; <span id="y">2026</span> RDF Pictures</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
